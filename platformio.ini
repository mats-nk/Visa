; ─── PlatformIO Project Configuration ────────────────────────────────────────
; LED Matrix – MD_MAX72XX + MQTT + OTA
;
; Targets:
;   esp8266   → Generic ESP8266 (e.g. Wemos D1 Mini, NodeMCU)
;   esp32     → Generic ESP32   (e.g. DOIT DevKit v1, Wemos D1 R32)
;   esp32s2   → ESP32-S2        (e.g. Unexpected Maker FeatherS2)
;   esp32c3   → ESP32-C3        (e.g. Seeed XIAO ESP32C3, LOLIN C3 Mini)
;
; Build a specific env:   pio run -e esp8266
; Upload:                 pio run -e esp8266 -t upload
; Monitor serial:         pio device monitor -e esp8266
; ──────────────────────────────────────────────────────────────────────────────

; ── Shared settings inherited by every environment ────────────────────────────
[common]
monitor_speed     = 115200
upload_speed      = 921600

; Library dependencies (registry short-form where possible):
;   knolleary/PubSubClient       – MQTT client
;   tzapu/WiFiManager            – captive-portal WiFi provisioning
;   majicdesigns/MD_MAX72XX      – MAX7219/MAX7221 LED matrix driver
lib_deps =
    knolleary/PubSubClient @ ^2.8
    tzapu/WiFiManager @ ^2.0.17
    majicdesigns/MD_MAX72XX @ ^3.5.1

build_flags_common =
    -D MQTT_MAX_PACKET_SIZE=768   ; HA discovery payloads can reach 600+ bytes
    -D MQTT_KEEPALIVE=60

; ── ESP8266 ───────────────────────────────────────────────────────────────────
[env:esp8266]
platform  = espressif8266 @ ^4.2.1
board     = d1_mini          ; Wemos D1 Mini — change to nodemcuv2, esp01_1m, etc.
framework = arduino

monitor_speed = ${common.monitor_speed}
upload_speed  = ${common.upload_speed}

lib_deps = ${common.lib_deps}

build_flags =
    ${common.build_flags_common}
    -D ARDUINO_ARCH_ESP8266      ; guard used in .ino for WiFi header selection
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH

board_build.filesystem = littlefs   ; optional – only needed if you add LittleFS use

; OTA upload (after first flash via USB)
; Uncomment and set the device IP + password:
; upload_protocol = espota
; upload_port     = 192.168.0.xxx
; upload_flags    = --auth=admin

