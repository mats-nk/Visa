name: Build and Release

on:
  push:
    tags:
      - '*'          # triggers on any tag push e.g. 2025-03-07.3

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [esp8266, esp32, esp32s2, esp32c3]

    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.target }}-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.target }}

      - name: Rename binary
        run: |
          VERSION=${GITHUB_REF_NAME}
          mkdir -p dist
          cp .pio/build/${{ matrix.target }}/firmware.bin \
             dist/LED_Matrix_${{ matrix.target }}_${VERSION}.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: dist/*.bin

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
